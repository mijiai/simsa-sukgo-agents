name: CI/CD

# 트리거:
#   - main / develop 으로의 push 또는 PR → test job 실행
#   - main 으로의 push (PR 머지 포함) → test 통과 후 deploy job 실행
#   - 수동 실행 (workflow_dispatch)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  RG: SIMSASUKGO-RG
  LOCATION: eastus2
  ACR_NAME: simsasukgoacr
  ACA_APP: simsasukgo-mcp
  IMAGE_NAME: simsasukgo-mcp
  TARGET_PORT: "8000"

jobs:
  test:
    name: Test (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: pytest
        run: uv run pytest -q

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Compute image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image via az acr build (cloud build)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.meta.outputs.tag }}" \
            --image "$IMAGE_NAME:latest" \
            --file Dockerfile \
            .

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          ACR_USERNAME=$(az acr credential show -n "$ACR_NAME" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          {
            echo "server=$ACR_SERVER"
            echo "username=$ACR_USERNAME"
            echo "password=$ACR_PASSWORD"
          } >> "$GITHUB_OUTPUT"

      - name: Update ACA secrets
        run: |
          az containerapp secret set \
            --name "$ACA_APP" \
            --resource-group "$RG" \
            --secrets \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "azure-storage-connection-string=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              "naver-client-id=${{ secrets.NAVER_CLIENT_ID }}" \
              "naver-client-secret=${{ secrets.NAVER_CLIENT_SECRET }}" \
            -o none

      - name: Update ACA registry credentials
        run: |
          az containerapp registry set \
            --name "$ACA_APP" \
            --resource-group "$RG" \
            --server "${{ steps.acr.outputs.server }}" \
            --username "${{ steps.acr.outputs.username }}" \
            --password "${{ steps.acr.outputs.password }}" \
            -o none

      - name: Deploy new image + env vars
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$RG" \
            --image "${{ steps.acr.outputs.server }}/$IMAGE_NAME:${{ steps.meta.outputs.tag }}" \
            --set-env-vars \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage-connection-string" \
              "NAVER_CLIENT_ID=secretref:naver-client-id" \
              "NAVER_CLIENT_SECRET=secretref:naver-client-secret" \
              "AZURE_STORAGE_BLOB_CONTAINER=simsasukgo" \
              "ANTHROPIC_MODEL=claude-haiku-4-5-20251001" \
              "REPORT_MODEL=claude-sonnet-4-6" \
              "REPORT_MAX_TOKENS=8192" \
              "REPORT_SAS_EXPIRY_HOURS=168" \
              "REPORT_SAMPLES_BLOB_PREFIX=templates/report_samples/" \
              "GMAIL_CREDENTIALS_BLOB_PATH=credentials/gmail_oauth.json" \
              "ALERT_MIN_RISK_LEVEL=MEDIUM" \
              "ALERT_DEDUP_DAYS=90" \
              "ALERT_FIRST_RUN_SEND=true" \
              "MONITORING_CATCHUP_THRESHOLD_DAYS=90" \
              "MONITORING_SCHEDULER_ENABLED=true" \
              "MCP_HOST=0.0.0.0" \
              "MCP_PORT=$TARGET_PORT" \
              "LOG_LEVEL=INFO" \
              "LOG_FORMAT=json" \
            -o none

      - name: Health check (6 retries × 15s)
        run: |
          FQDN=$(az containerapp show -n "$ACA_APP" -g "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "App URL: https://$FQDN"
          for i in 1 2 3 4 5 6; do
            if curl -sf -m 10 "https://$FQDN/health" > /dev/null; then
              echo "✅ Health check passed (attempt $i)"
              {
                echo "## ✅ Deployment successful"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| App URL | https://$FQDN |"
                echo "| Health | https://$FQDN/health |"
                echo "| MCP SSE | https://$FQDN/sse |"
                echo "| Image tag | \`${{ steps.meta.outputs.tag }}\` |"
                echo "| Commit | ${GITHUB_SHA::7} |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 6 attempts (90s)"
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
