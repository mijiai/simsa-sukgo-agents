name: loan_application_v1

# 9개 표준 섹션 + 별첨. 모든 회사 보고서가 동일 양식으로 출력되도록 강제하는 스펙.
# section_id 는 src/common/constants.py 의 ReportSection enum 값과 1:1 매칭.
# table_id 는 financial.section_insights[].table_id 와 1:1 매칭 → bullet 자동 정렬.

sections:
  # ───────────────────── 1. 차주 개요 ─────────────────────
  - section_id: 1_overview
    number: "1"
    title: 차주 개요
    tables:
      - table_id: 기업 개요
        title: 기업 개요
        source_label: "※ 출처: 사업자등록 정보 및 차주 제출 자료"
        data_source: "raw.company_overview"
        commentary_required: false
    images: []

  # ───────────────────── 2. 여신 개요 ─────────────────────
  - section_id: 2_loan_summary
    number: "2"
    title: 여신 개요
    tables:
      - table_id: 여신 신청 요지
        title: 여신 신청 요지
        source_label: "※ 출처: 여신 신청서"
        data_source: "raw.loan_request"
        commentary_required: false
    images: []

  # ─────────────────── 3. 여신 신청 조건 ───────────────────
  - section_id: 3_loan_terms
    number: "3"
    title: 여신 신청 조건
    tables:
      - table_id: 여신 신청 조건
        title: 여신 거래 조건
        source_label: "※ 출처: 여신 신청서"
        data_source: "raw.loan_terms"
        commentary_required: true
    images: []

  # ───────────────────── 4. 사업 현황 ─────────────────────
  - section_id: 4_business
    number: "4"
    title: 사업 현황
    tables:
      - table_id: 사업 구조
        title: 사업 부문 및 매출 구성
        source_label: "※ 출처: 차주 제출 자료 및 외부감사 회계감사보고서"
        data_source: "extracted_tables.사업구조"
        commentary_required: true
    images:
      - image_id: 사업 구조도
        title: 사업 구조도
        suspected_role: ownership_chart
        optional: true

  # ───────────────────── 5. 재무 현황 ─────────────────────
  - section_id: 5_finance
    number: "5"
    title: 재무 현황
    tables:
      - table_id: 재무제표
        title: 주요 재무제표 추이
        source_label: "※ 출처: 외부감사 회계감사보고서"
        data_source: "extracted_tables.재무제표"
        commentary_required: true
      - table_id: 자산건전성
        title: 자산건전성 지표
        source_label: "※ 출처: 업무보고서"
        data_source: "extracted_tables.자산건전성"
        commentary_required: true
      - table_id: 자본적정성
        title: 자본적정성 지표
        source_label: "※ 출처: 업무보고서"
        data_source: "extracted_tables.자본적정성"
        commentary_required: true
    images: []

  # ──────────────────── 6. 차입금 현황 ────────────────────
  - section_id: 6_debt
    number: "6"
    title: 차입금 현황
    tables:
      - table_id: 차입금 구성
        title: 차입금 구성 및 추이
        source_label: "※ 출처: 외부감사 회계감사보고서 및 업무보고서"
        data_source: "extracted_tables.차입금구성"
        commentary_required: true
    images: []

  # ──────────────────── 7. 유동성 현황 ────────────────────
  - section_id: 7_liquidity
    number: "7"
    title: 유동성 현황
    tables:
      - table_id: 만기구조
        title: 자산·부채 만기구조
        source_label: "※ 출처: 업무보고서"
        data_source: "extracted_tables.만기구조"
        commentary_required: true
      - table_id: 자금수지
        title: 자금수지 추이
        source_label: "※ 출처: 외부감사 회계감사보고서"
        data_source: "extracted_tables.자금수지"
        commentary_required: true
    images: []

  # ──────────────────── 8. 관계사 현황 ────────────────────
  - section_id: 8_affiliates
    number: "8"
    title: 관계사 현황
    tables:
      - table_id: 관계사 목록
        title: 주요 관계사 현황
        source_label: "※ 출처: 차주 제출 자료"
        data_source: "extracted_tables.관계사"
        commentary_required: true
    images:
      - image_id: 지분 구조도
        title: 지분 구조도
        suspected_role: ownership_chart
        optional: true

  # ──────────────────── 9. 종합 의견 ─────────────────────
  - section_id: 9_conclusion
    number: "9"
    title: 종합 의견
    tables: []
    images: []
